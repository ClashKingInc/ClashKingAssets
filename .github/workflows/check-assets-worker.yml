name: Check Assets Worker

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'build.py'
      - 'generate_emoji_catalog.py'
      - 'sync_discord_emojis.py'
      - 'update_static.py'
      - 'worker_purge.py'
      - 'check_image_sources.py'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/check-assets-worker.yml'
      - '.github/workflows/release-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - run: npm ci --prefix worker
      - run: npm run typecheck --prefix worker
      - run: npm run build --prefix worker
      - run: python -m pip install python-dotenv ruff pillow
      - run: python generate_emoji_catalog.py --check
      - run: python check_image_sources.py
      - run: python -m ruff check build.py worker_purge.py check_image_sources.py
